name: Supabase development keep-alive

"on":
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-dev-keepalive
  cancel-in-progress: false

jobs:
  database-read:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out the checker
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/supabase_keepalive.py
          sparse-checkout-cone-mode: false
      - name: Read the development heartbeat
        env:
          SUPABASE_DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          SUPABASE_DEV_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: python3 -I scripts/supabase_keepalive.py

services:
  backend:
    image: ai-tutor-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure:3
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      SUPABASE_AUTH_TIMEOUT_SECONDS: "15"
      PREWARM_MODELS: "false"
      LOCAL_SHARED_MODELS: "true"
      RERANKER_MODEL_NAME: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
      LOCAL_MODEL_MAX_TOKENS: "512"
      RETRIEVAL_ROUTING_MODE: always_quality
      EMBEDDING_DEVICE: cpu
      RERANKER_DEVICE: cpu
      EMBEDDING_BATCH_SIZE: "1"
      RERANKER_BATCH_SIZE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      AUTO_EMBED_AFTER_INGESTION: "true"
      HF_HOME: /models/huggingface
      TIKTOKEN_CACHE_DIR: /models/tiktoken
      EMBEDDING_MODEL_CACHE_DIR: /models/huggingface
      RERANKER_MODEL_CACHE_DIR: /models/huggingface
      TESSERACT_CMD: tesseract
      LIBREOFFICE_CMD: soffice
    volumes:
      - model-cache:/models
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  ingestion-worker:
    image: ai-tutor-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.ingestion_queue"]
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      PREWARM_MODELS: "false"
      LOCAL_SHARED_MODELS: "true"
      LOCAL_MODEL_API_URL: http://backend:8000
      EMBEDDING_DEVICE: cpu
      RERANKER_DEVICE: cpu
      EMBEDDING_BATCH_SIZE: "1"
      RERANKER_BATCH_SIZE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      AUTO_EMBED_AFTER_INGESTION: "false"
      HF_HOME: /models/huggingface
      TIKTOKEN_CACHE_DIR: /models/tiktoken
      EMBEDDING_MODEL_CACHE_DIR: /models/huggingface
      RERANKER_MODEL_CACHE_DIR: /models/huggingface
      TESSERACT_CMD: tesseract
      LIBREOFFICE_CMD: soffice
    volumes:
      - model-cache:/models
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://placeholder.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-placeholder-anon-key}
        NEXT_PUBLIC_DEPLOYMENT_TARGET: local
    restart: on-failure:3
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  model-cache:
